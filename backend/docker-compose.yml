version: '3.8'

services:
  # FastAPI应用
  api:
    build: .
    container_name: emotion_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - api_logs:/var/log
    restart: unless-stopped
    networks:
      - emotion_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL数据库
  db:
    image: mysql:8.0
    container_name: emotion_db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=emotion_legacy_db
      - TZ=Asia/Shanghai
    # 如果宿主机已经运行MySQL，改为映射到3307以避免端口冲突
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 如果需要初始化SQL脚本，请将单个文件放在 backend/init.sql（而不是目录），
      # 或者删除下面的挂载（当前 init.sql 是目录，会导致初始化失败）。
    restart: unless-stopped
    networks:
      - emotion_network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: emotion_nginx
    # 主机80/443可能被系统或其他服务占用，改为映射到8080/8443以避免冲突
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - emotion_network

volumes:
  mysql_data:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  emotion_network:
    driver: bridge
