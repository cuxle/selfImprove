name: emotion_legacy
description: 情绪遗产 - 心理健康自我觉察应用

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 网络请求
  http: ^1.1.2
  dio: ^5.4.0

  # 本地存储
  shared_preferences: ^2.2.2

  # 本地通知
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # 文件系统访问
  path_provider: ^2.1.1
  file_picker: ^8.1.6

  # 路由导航
  go_router: ^13.0.0

  # JSON序列化
  json_annotation: ^4.8.1

  # UI组件
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.18.1

  # 表单验证
  email_validator: ^2.1.17

  # 图表
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # 如果需要添加资源文件
  # assets:
  #   - assets/images/
  #   - assets/icons/
